<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehaltsspanne für die Anzeige</title>
<meta name="description" content="In vier Schritten zu einer Gehaltsspanne für die Stellenanzeige">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F8FD; --surface2:#EBF0FA; --ink:#001432; --muted:#4A5878; --line:#D3DDF0;
  --primary:#0028D2; --primary-ink:#FFFFFF; --deep:#000096; --soft:#96BEFA;
  --accent:#E8491D; --accent-soft:#FFE9E1; --yellow:#FFD778; --yellow-soft:#FFF5DA;
  --ok:#17744A; --ok-soft:#E2F3EA;
  --g-w:#FF5F32; --g-m:#0028D2; --g-d:#C79100;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#001432; --surface:#062048; --surface2:#0A2958; --ink:#EBF0FA; --muted:#9DB0D2; --line:#1C3A6C;
    --primary:#96BEFA; --primary-ink:#001432; --deep:#C9DBFB; --soft:#2C4F8F;
    --accent:#FF8461; --accent-soft:#3B1D25; --yellow:#FFD778; --yellow-soft:#3A3322;
    --ok:#74D6A2; --ok-soft:#0F3A2C;
    --g-w:#FF8461; --g-m:#96BEFA; --g-d:#FFD778;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#001432; --surface:#062048; --surface2:#0A2958; --ink:#EBF0FA; --muted:#9DB0D2; --line:#1C3A6C;
  --primary:#96BEFA; --primary-ink:#001432; --deep:#C9DBFB; --soft:#2C4F8F;
  --accent:#FF8461; --accent-soft:#3B1D25; --yellow:#FFD778; --yellow-soft:#3A3322;
  --ok:#74D6A2; --ok-soft:#0F3A2C;
  --g-w:#FF8461; --g-m:#96BEFA; --g-d:#FFD778;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,5vw,52px)}
h2{font-size:30px}
h3{font-size:22px}
h1 em,h2 em{font-style:italic;color:var(--primary)}
p{margin:0}
.lede{max-width:62ch;color:var(--muted);font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--deep);border-color:var(--deep);color:var(--primary-ink)}
.btn.danger{color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px;font-size:18px;line-height:1}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--soft)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.logo{height:34px;width:auto;display:block}
.brandline{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brandline span{color:var(--primary)}
.wordmark{font-family:var(--serif);font-size:24px;letter-spacing:-.01em}
.wordmark i{color:var(--primary)}
.privacy{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.orbit{position:relative}
.orbit svg{position:absolute;right:-20px;top:-10px;width:230px;height:230px;opacity:.45;pointer-events:none}
.orbit>*:not(svg){position:relative}
@media (max-width:1000px){.orbit svg{display:none}}
.toggle{justify-self:start;width:max-content;max-width:100%;flex-wrap:wrap}
.hero{display:grid;gap:14px;margin-bottom:28px;position:relative}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto;scrollbar-width:thin}
.tab{border:none;background:none;padding:12px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .n{font-family:var(--serif);font-size:20px;line-height:1}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
.tab:hover{color:var(--ink)}
.panel{display:grid;gap:24px}
.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:24px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.joblist{display:grid;gap:6px}
.jobitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.jobitem:hover{background:var(--surface2)}
.jobitem[aria-current=true]{background:var(--bg);border-color:var(--primary)}
.jobitem .nm{font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.eg{background:var(--primary);color:var(--primary-ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.na{background:var(--surface2);color:var(--muted)}
.chip.yel{background:var(--yellow-soft);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.crit-group{display:grid;gap:14px}
.crit-group + .crit-group{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.crit{display:grid;gap:8px}
.crit-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.crit-name{font-weight:500}
.crit-w{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:40px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.seg button:hover{border-color:var(--primary)}
.seg button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.crit-desc{font-size:14px;color:var(--muted);min-height:1.5em}
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.score .big{font-family:var(--serif);font-size:48px;line-height:1}
.score .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.arch{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;min-width:720px}
.arch-col{display:flex;flex-direction:column;gap:6px}
.arch-h{font-family:var(--serif);font-size:20px;padding:6px 8px;border-bottom:2px solid var(--primary)}
.arch-h small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.arch-job{font-size:12.5px;padding:6px 8px;background:var(--surface2);border-radius:6px;line-height:1.3}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
table input,table select{padding:5px 8px}
.emp-table{min-width:880px}
.emp-table input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.kpi .v{font-family:var(--serif);font-size:38px;line-height:1.05}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.alert{border-color:var(--accent)}
.kpi.alert .v{color:var(--accent)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.settings{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{width:120px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.callout{border-left:3px solid var(--yellow);background:var(--yellow-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14px}
.letter{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:24px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:72ch}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.toggle button{border:none;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.toggle button[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
details summary{cursor:pointer;font-weight:500}
details[open] summary{margin-bottom:12px}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.weights label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.weights input{width:70px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:10}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:6px;max-width:80ch}

/* Leadmagnet */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.pair{grid-template-columns:1fr}}
.pair .card{display:grid;gap:18px;align-content:start}
.tag{font-family:var(--serif);font-size:26px;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.verdict{border-radius:var(--r);padding:26px;display:grid;gap:14px;border:1px solid var(--line);background:var(--surface)}
.verdict.eq{border-color:var(--primary)}
.verdict h2{font-size:clamp(28px,4vw,40px)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.vs .side{display:grid;gap:2px}
.vs .side:last-child{text-align:right}
.vs .pts{font-family:var(--serif);font-size:44px;line-height:1}
.bar{height:10px;border-radius:999px;background:var(--surface2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:999px}
.cta{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:28px;display:grid;gap:14px}
.cta h3{font-size:28px}
.cta ul{margin:0;padding-left:18px;display:grid;gap:4px;opacity:.9}
.cta .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#001432;justify-self:start}

.matrix{border-collapse:separate;border-spacing:6px;min-width:680px}
.matrix th{border:none;padding:4px 6px;font-size:12px}
.matrix td{border:none;padding:0;vertical-align:top}
.matrix td.gcell{font-family:var(--serif);font-size:20px;white-space:nowrap;padding:6px 10px 6px 0;border-right:2px solid var(--primary)}
.matrix td.gcell small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.mcell{display:flex;flex-direction:column;gap:4px;min-height:34px;background:var(--surface);border-radius:6px;padding:4px}
.mjob{font-size:12.5px;padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;line-height:1.3;display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.trk{font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap}
.trk.Fach{background:var(--surface2);color:var(--primary)}
.trk.Führung{background:var(--primary);color:var(--primary-ink)}
.trk.Projekt{background:var(--yellow-soft);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field.wide input,.field.wide select{width:100%}
td input.anchor{width:120px;text-align:right}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const pct = v => (v*100).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1}) + " %";
const cr = v => Math.round(v*100) + " %";
function W(){ return (S.weights||CRIT.map(c=>c.w)); }
function scaleMin(){ const w=W(); return CRIT.reduce((a,c,i)=>a+w[i]*1,0); }
function scaleMax(){ const w=W(); return CRIT.reduce((a,c,i)=>a+w[i]*c.levels.length,0); }
function points(job){ const w=W(); return job.s.reduce((a,v,i)=>a+v*w[i],0); }
function grade(p){ const mn=scaleMin(), mx=scaleMax(), st=(mx-mn)/NGRADES; return Math.max(1,Math.min(NGRADES, Math.floor((p-mn)/st)+1)); }
function gradeRange(g){ const mn=scaleMin(), st=(scaleMax()-mn)/NGRADES; return [Math.round(mn+(g-1)*st), Math.round(mn+g*st)]; }
function jobById(id){ return S.jobs.find(j=>j.id===id); }
function fteTotal(e){ const h = e.h>0? e.h : S.fte; return ((+e.fix||0)+(+e.v||0)) * S.fte / h; }
function fteVar(e){ const h = e.h>0? e.h : S.fte; return (+e.v||0) * S.fte / h; }
const mean = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : NaN;
function median(a){ if(!a.length) return NaN; const b=[...a].sort((x,y)=>x-y), m=Math.floor(b.length/2); return b.length%2?b[m]:(b[m-1]+b[m])/2; }

function analysis(){
  const rows = S.emps.map(e=>{ const j=jobById(e.job); if(!j) return null; const p=points(j); return {e, j, p, g:grade(p), pay:fteTotal(e), vpay:fteVar(e)}; }).filter(Boolean).filter(r=>r.pay>0);
  // Pay Policy Line: lineare Regression Ist-Entgelt über Punkte
  let a=0,b=0; const n=rows.length;
  if(n>=2){ const mx=mean(rows.map(r=>r.p)), my=mean(rows.map(r=>r.pay)); let sxy=0,sxx=0;
    rows.forEach(r=>{sxy+=(r.p-mx)*(r.pay-my); sxx+=(r.p-mx)**2;}); b = sxx>0? sxy/sxx : 0; a = my - b*mx; }
  else if(n===1){ a=rows[0].pay; }
  const line = p => a + b*p;
  // Gehaltsbänder: Midpoints mit fester Midpoint Progression, verankert an Markt- oder Ist-Daten
  const prog=S.prog/100, spread=S.spread/100, anchors=S.anchor||{};
  const byG = g => rows.filter(r=>r.g===g);
  let pairs = Object.keys(anchors).map(g=>[+g, +anchors[g]]).filter(([g,v])=>v>0);
  const source = pairs.length ? "markt" : "intern";
  if(!pairs.length) for(let g=1; g<=NGRADES; g++){ const rs=byG(g); if(rs.length) pairs.push([g, mean(rs.map(r=>r.pay))]); }
  const M1 = pairs.length ? Math.exp(mean(pairs.map(([g,v])=>Math.log(v)-(g-1)*Math.log(1+prog)))) : 0;
  const grades=[];
  for(let g=1; g<=NGRADES; g++){
    const rs = byG(g), [lo,hi]=gradeRange(g);
    const mid = M1*Math.pow(1+prog,g-1), min = mid*2/(2+spread), max = min*(1+spread);
    const w = rs.filter(r=>r.e.g==="w").map(r=>r.pay), m = rs.filter(r=>r.e.g==="m").map(r=>r.pay);
    const gap = (w.length && m.length) ? (mean(m)-mean(w))/mean(m) : null;
    const jobs = S.jobs.filter(j=>grade(points(j))===g);
    grades.push({g, lo, hi, rs, jobs, mid, min, max, w, m, gap});
  }
  rows.forEach(r=>{ const G=grades[r.g-1]; r.mid=G.mid; r.cr = G.mid? r.pay/G.mid : NaN; r.circle = r.pay>G.max ? "red" : r.pay<G.min ? "green" : null; });
  grades.forEach(G=>{ G.cr = G.rs.length ? mean(G.rs.map(r=>r.cr)) : null; });
  const Wr = rows.filter(r=>r.e.g==="w"), Mr = rows.filter(r=>r.e.g==="m");
  const ok = Wr.length && Mr.length;
  const gapMean = ok ? (mean(Mr.map(r=>r.pay))-mean(Wr.map(r=>r.pay)))/mean(Mr.map(r=>r.pay)) : null;
  const gapMed  = ok ? (median(Mr.map(r=>r.pay))-median(Wr.map(r=>r.pay)))/median(Mr.map(r=>r.pay)) : null;
  const vm = mean(Mr.map(r=>r.vpay)), vw = mean(Wr.map(r=>r.vpay));
  const gapVar = (ok && vm>0) ? (vm-vw)/vm : null;
  return {rows, grades, line, source, gapMean, gapMed, gapVar};
}

function chart(A){
  const rows=A.rows; if(!rows.length) return `<p class="note">Noch keine Ist-Gehälter erfasst.</p>`;
  const Wd=760, H=380, m={l:78,r:20,t:34,b:44};
  const ps=rows.map(r=>r.p);
  const gs=[...new Set(rows.map(r=>r.g))];
  let x0=Math.min(...ps, ...gs.map(g=>gradeRange(g)[0])), x1=Math.max(...ps, ...gs.map(g=>gradeRange(g)[1]));
  const ys=rows.map(r=>r.pay).concat(gs.map(g=>A.grades[g-1].min), gs.map(g=>A.grades[g-1].max));
  const step = niceStep((Math.max(...ys)-Math.min(...ys))/5);
  const y0=Math.floor(Math.min(...ys)*0.97/step)*step, y1=Math.ceil(Math.max(...ys)*1.02/step)*step;
  const X=v=>m.l+(v-x0)/(x1-x0)*(Wd-m.l-m.r), Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Gehaltsbänder je Grade mit Ist-Gehältern">`;
  for(let v=y0; v<=y1+1; v+=step){ s+=`<line x1="${m.l}" x2="${Wd-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--sans)">${(v/1000).toLocaleString("de-DE")} T€</text>`; }
  for(let g=1; g<=NGRADES; g++){ const [lo,hi]=gradeRange(g); const a=Math.max(lo,x0), b=Math.min(hi,x1); if(b<=a) continue; const G=A.grades[g-1];
    s+=`<line x1="${X(a)}" x2="${X(a)}" y1="${m.t-6}" y2="${H-m.b}" stroke="var(--line)" stroke-dasharray="3 4"/>`;
    if(X(b)-X(a)>44) s+=`<text x="${(X(a)+X(b))/2}" y="${m.t-12}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--sans)">Grade ${g}</text>`;
    const top=Math.min(G.max,y1), bot=Math.max(G.min,y0);
    if(top>bot){ s+=`<rect x="${X(a)+2}" y="${Y(top)}" width="${X(b)-X(a)-4}" height="${Y(bot)-Y(top)}" fill="var(--primary)" opacity=".10" rx="3"/>`; }
    if(G.mid>y0 && G.mid<y1) s+=`<line x1="${X(a)+2}" x2="${X(b)-2}" y1="${Y(G.mid)}" y2="${Y(G.mid)}" stroke="var(--primary)" stroke-width="2"/>`; }
  s+=`<line x1="${X(x0)}" y1="${Y(A.line(x0))}" x2="${X(x1)}" y2="${Y(A.line(x1))}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  rows.forEach(r=>{ s+=`<g>${shape(r.e.g, X(r.p), Y(r.pay))}<title>${esc(r.e.code)} · ${esc(r.j.name)} · ${gLabel[r.e.g]} · ${eur.format(r.pay)} · Compa-Ratio ${cr(r.cr)}</title></g>`; });
  s+=`<line x1="${m.l}" x2="${Wd-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--muted)"/>`;
  const xt=niceStep((x1-x0)/6); for(let v=Math.ceil(x0/xt)*xt; v<=x1; v+=xt){ s+=`<text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--sans)">${v}</text>`; }
  s+=`<text x="${(m.l+Wd-m.r)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--sans)">Punkte der Stellenbewertung</text></svg>`;
  return `<div class="chart-wrap">${s}</div>`;
}

function tabMethod(){
  const w=W();
  const steps=[
    ["Stellenanalyse","Anforderungen jeder Stelle klären, unabhängig von der Person, die sie heute besetzt."],
    ["Analytische Stellenbewertung","Stufenwertzahlverfahren: acht Kriterien, Stufe mal Gewicht ergibt die Punkte."],

    ["Vergütungsstruktur","Gehaltsbänder je Grade: Midpoint verankert an Markt- oder Ist-Daten, Midpoint Progression "+S.prog+" %, Range Spread "+S.spread+" %."],
    ["Einordnung der Ist-Gehälter","Compa-Ratio je Person, Red Circles über dem Maximum, Green Circles unter dem Minimum."],

      <p class="note">Die Richtung ist entscheidend: Bänder folgen aus den Grades, nie umgekehrt. Werden Grades aus heutigen Gehältern abgeleitet, zementiert das bestehende Entgeltgefälle.</p>

    </div>
    <div class="foot">
      <span>Orientierungshilfe von People Nova, keine Rechtsberatung. Vereinfachtes Stufenwertzahlverfahren mit den vier Hauptkriterien aus Art. 4 Abs. 4 der Richtlinie 2023/970. Stand Ende Juni 2026: Deutschland hat die Richtlinie noch nicht umgesetzt, die Frist lief am 7. Juni 2026 ab.</span>
      <div class="row"><button class="btn small" data-act="sample">Beispiel zurücksetzen</button></div>
    </div>`;
}


/* =====================================================
   RECRUITING SPRINT: Gehaltsspanne für die Stellenanzeige (Basis)
   ===================================================== */
function sprintSample(){
  return {jobs:[], sp:{job:"Office Management", has:"ja", comp:"Buchhaltung Sachbearbeitung", cmin:42000, cmax:48000, level:"mehr", med:47000, src:"Entgeltatlas der Bundesagentur für Arbeit", fmin:"", fmax:"", checks:{}}, weights:CRIT.map(c=>c.w)};
}
const r500 = v => Math.round(v/500)*500;
const LEVELS = [["weniger","weniger anspruchsvoll",0.9],["gleich","etwa gleich",1],["mehr","anspruchsvoller",1.1]];
const CHECKS = [
  ["anzeige","Die Spanne steht in der Anzeige oder wird spätestens vor dem ersten Gespräch genannt."],
  ["historie","Im Gespräch fragst Du nicht nach dem bisherigen Gehalt. Die Gehaltsvorstellung darfst Du weiterhin erfragen."],
  ["titel","Der Stellentitel ist geschlechtsneutral, z. B. mit (m/w/d) oder einer neutralen Bezeichnung."],
  ["notiz","Du hast notiert, wie Du auf die Spanne gekommen bist. Die Notiz unten kannst Du dafür kopieren."],
  ["angebot","Beim Angebot bleibst Du innerhalb dieser Spanne."]
];
function spCalc(p){
  const f = (LEVELS.find(l=>l[0]===p.level)||LEVELS[1])[2];
  const hasComp = p.has==="ja" && +p.cmin>0 && +p.cmax>=+p.cmin;
  const med = +p.med||0;
  let lo=0, hi=0, basis="";
  if(hasComp){ lo=r500(p.cmin*f); hi=r500(p.cmax*f); basis="Vergleichsstelle"; }
  else if(med>0){ lo=r500(med*0.9); hi=r500(med*1.1); basis="Markt"; }
  const flo = +p.fmin>0 ? +p.fmin : lo, fhi = +p.fmax>0 ? +p.fmax : hi;
  const off = hasComp && med>0 && (med<lo*0.9 || med>hi*1.1);
  return {f, hasComp, med, lo, hi, flo, fhi, basis, off};
}
function renderSprint(){
  const p = S.sp, c = spCalc(p);
  const today = new Date().toLocaleDateString("de-DE");
  const adLine = c.flo&&c.fhi ? `Gehalt: ${eur.format(c.flo)} bis ${eur.format(c.fhi)} brutto im Jahr (Vollzeit), je nach Erfahrung.` : "";
  const note =
`Gehaltsspanne: ${p.job||"neue Stelle"}
Spanne: ${c.flo&&c.fhi?eur.format(c.flo)+" bis "+eur.format(c.fhi)+" brutto im Jahr (Vollzeit)":"offen"}
Grundlage: ${c.hasComp?`Vergleichsstelle ${p.comp} (heute ${eur.format(p.cmin)} bis ${eur.format(p.cmax)}), neue Stelle ${(LEVELS.find(l=>l[0]===p.level)||LEVELS[1])[1]}`:"keine Vergleichsstelle im Haus"}
Marktabgleich: ${c.med?eur.format(c.med)+(p.src?" laut "+p.src:""):"nicht erfolgt"}
Stand: ${today}`;
  const step = (n,t,body) => `<section class="card" style="display:grid;gap:14px"><div class="row" style="flex-wrap:nowrap;align-items:center"><span class="tag">${n}</span><h3>${t}</h3></div>${body}</section>`;
  const radio = (k,opts) => `<div class="toggle">${opts.map(([v,l])=>`<button type="button" data-act="spset" data-k="${k}" data-v="${v}" aria-pressed="${p[k]===v}">${l}</button>`).join("")}</div>`;
  document.getElementById("app").innerHTML = `
    ${brand()}
    <div class="hero orbit">${ORBIT}
      <div class="eyebrow">Recruiting Sprint · Modul 2</div>
      <h1>Deine <em>Gehaltsspanne</em> für die Anzeige</h1>
      <p class="lede">Bewerber:innen haben künftig Anspruch darauf, die Gehaltsspanne vor dem ersten Gespräch zu erfahren, unabhängig davon, wie groß Dein Unternehmen ist. In vier Schritten kommst Du zu einer Spanne, die Du vertreten kannst.</p>
    </div>
    <div style="display:grid;gap:18px">
      ${step(1,"Welche Stelle besetzt Du?",`<label class="field wide">Stellenbezeichnung<input type="text" id="sp-job" value="${esc(p.job)}" data-act="sp" data-k="job" style="font-size:17px"></label>`)}
      ${step(2,"Gibt es bei Euch eine vergleichbare Stelle?",`
        <p class="note">Eine Stelle, die Ihr schon besetzt habt und deren Gehalt Du kennst. Sie muss nicht gleich heißen, sie sollte ähnlich viel Wissen und Verantwortung verlangen.</p>
        ${radio("has",[["ja","Ja"],["nein","Nein"]])}
        ${p.has==="ja"?`
          <label class="field wide">Vergleichsstelle<input type="text" id="sp-comp" value="${esc(p.comp)}" data-act="sp" data-k="comp"></label>
          <div class="row">
            <label class="field">Heute von (brutto/Jahr, Vollzeit)<input type="number" id="sp-cmin" step="500" value="${p.cmin||""}" data-act="spn" data-k="cmin" style="width:170px"></label>
            <label class="field">bis<input type="number" id="sp-cmax" step="500" value="${p.cmax||""}" data-act="spn" data-k="cmax" style="width:170px"></label>
          </div>
          <div class="field">Die neue Stelle ist im Vergleich ${radio("level",LEVELS.map(l=>[l[0],l[1]]))}</div>
          <p class="note">Faustregel: anspruchsvoller heißt rund 10 % mehr, weniger anspruchsvoll rund 10 % weniger.</p>`
        :`<p class="note">Kein Problem. Dann leitest Du die Spanne in Schritt 3 aus dem Markt ab.</p>`}`)}
      ${step(3,"Mit dem Markt abgleichen",`
        <p class="note">Schau nach, was für diese Stelle in Deiner Region üblich ist. Kostenlos und seriös ist der <a href="https://web.arbeitsagentur.de/entgeltatlas/" target="_blank" rel="noopener">Entgeltatlas der Bundesagentur für Arbeit</a>. Trag den Median ein.</p>
        <div class="row">
          <label class="field">Median (brutto/Jahr, Vollzeit)<input type="number" id="sp-med" step="500" value="${p.med||""}" data-act="spn" data-k="med" style="width:190px"></label>
          <label class="field" style="flex:1;min-width:220px">Quelle<input type="text" id="sp-src" value="${esc(p.src)}" data-act="sp" data-k="src" style="width:100%"></label>
        </div>
        ${c.off?`<div class="callout">Der Marktwert liegt deutlich außerhalb Deiner Spanne. Prüfe, ob die Vergleichsstelle heute passend bezahlt wird, bevor Du die Spanne übernimmst.</div>`:""}`)}
      ${step(4,"Spanne festlegen",`
        ${c.lo?`<p>Vorschlag aus ${c.basis==="Markt"?"dem Marktwert (± 10 %)":"der Vergleichsstelle"}: <b style="font-weight:500" class="num">${eur.format(c.lo)} bis ${eur.format(c.hi)}</b>. Du kannst die Werte anpassen.</p>`:`<p class="note">Trag in Schritt 2 oder 3 Zahlen ein, dann erscheint hier ein Vorschlag.</p>`}
        <div class="row">
          <label class="field">Von<input type="number" id="sp-fmin" step="500" value="${c.flo||""}" data-act="spn" data-k="fmin" style="width:170px"></label>
          <label class="field">Bis<input type="number" id="sp-fmax" step="500" value="${c.fhi||""}" data-act="spn" data-k="fmax" style="width:170px"></label>
        </div>
        ${adLine?`<div class="verdict eq"><div class="eyebrow">Satz für Deine Anzeige</div><h2 id="adline" style="font-size:clamp(22px,3vw,30px)">${esc(adLine)}</h2><button class="btn primary" data-act="copyad" style="justify-self:start">Satz kopieren</button></div>`:""}`)}
    </div>
    <div class="card" style="margin-top:24px;display:grid;gap:12px">
      <h3>Bevor die Anzeige rausgeht</h3>
      <div style="display:grid;gap:10px">${CHECKS.map(([k,t])=>`<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="chk-${k}" data-act="spchk" data-k="${k}" ${p.checks&&p.checks[k]?"checked":""} style="width:18px;height:18px;margin-top:3px;accent-color:var(--primary)"><span>${t}</span></label>`).join("")}</div>
    </div>
    <div style="margin-top:24px;display:grid;gap:12px">
      <div class="row between"><h3>Notiz für Deine Unterlagen</h3><button class="btn" data-act="copydoc">Notiz kopieren</button></div>
      <div class="letter" id="doc">${esc(note)}</div>
    </div>
    <div class="foot">
      <span>Orientierungshilfe von People Nova, keine Rechtsberatung. Grundlage ist Art. 5 der EU Entgelttransparenzrichtlinie 2023/970. Stand Ende Juni 2026: Deutschland hat die Richtlinie noch nicht in nationales Recht umgesetzt, die Frist lief am 7. Juni 2026 ab.</span>
      <div class="row"><button class="btn small" data-act="sample">Beispiel zurücksetzen</button></div>
    </div>`;
}

/* ---------- Events ---------- */
function render(){ save(); (MODE==="lead"?renderLead:MODE==="sprint"?renderSprint:renderMember)(); }
function dirty(){ if(MODE==="member") S.isSample=false; }
document.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="tab"){ S.tab=t.dataset.tab; render(); document.getElementById("tab-"+S.tab)?.focus(); }
  else if(a==="lvl"){ const j=jobById(t.dataset.job); j.s[+t.dataset.i]=+t.dataset.v; dirty(); render(); document.querySelector(`[data-act=lvl][data-job="${j.id}"][data-i="${t.dataset.i}"][data-v="${t.dataset.v}"]`)?.focus(); }
  else if(a==="seljob"){ S.sel=t.dataset.job; render(); }
  else if(a==="addjob"){ const j={id:uid(),name:"Neue Stelle",fam:"",track:"Fach",s:CRIT.map(()=>1)}; S.jobs.push(j); S.sel=j.id; dirty(); render(); const inp=document.getElementById("jobname-"+j.id); inp?.focus(); inp?.select(); }
  else if(a==="deljob"){ const id=t.dataset.job; S.jobs=S.jobs.filter(j=>j.id!==id); S.emps.forEach(e=>{if(e.job===id)e.job="";}); S.sel=S.jobs[0]?.id; dirty(); render(); }
  else if(a==="archby"){ S.archBy=t.dataset.k; render(); }
  else if(a==="addemp"){ S.emps.push({id:uid(),code:"MA"+String(S.emps.length+1).padStart(2,"0"),job:S.jobs[0]?.id||"",g:"w",fix:0,v:0,h:S.fte}); dirty(); render(); }
  else if(a==="delemp"){ S.emps=S.emps.filter(e=>e.id!==t.dataset.id); dirty(); render(); }
  else if(a==="form"){ S.form=t.dataset.f; render(); }
  else if(a==="spset"){ S.sp[t.dataset.k]=t.dataset.v; render(); }
  else if(a==="copyad"){ copyText(document.getElementById("adline").textContent, document.getElementById("adline")); }
  else if(a==="copydoc"){ copyText(document.getElementById("doc").textContent, document.getElementById("doc")); }
  else if(a==="copyletter"){ copyText(document.getElementById("letter").textContent, document.getElementById("letter")); }
  else if(a==="copycsv"){ const A=analysis(); const byId=Object.fromEntries(A.rows.map(r=>[r.e.id,r]));
    const lines=[["Kürzel","Stelle","Jobfamilie","Laufbahn","Geschlecht","Fixgehalt","Variabel","Std/Woche","Vollzeit gesamt","Punkte","Grade","Compa-Ratio"].join("\t")].concat(S.emps.map(e=>{const r=byId[e.id], j=jobById(e.job);return [e.code,j?.name||"",j?.fam||"",j?.track||"",e.g,e.fix,e.v,e.h,r?Math.round(r.pay):"",r?r.p:"",r?r.g:"",r&&isFinite(r.cr)?r.cr.toFixed(2).replace(".",","):""].join("\t")}));
    copyText(lines.join("\n")); }
  else if(a==="import"){ const ta=document.getElementById("paste"); let ok=0; const miss=new Set();
    ta.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{ const c=l.split(/\t|;/).map(x=>x.trim()); const j=S.jobs.find(j=>j.name.toLowerCase()===(c[1]||"").toLowerCase());
      if(!j){ miss.add(c[1]||"(leer)"); return; } const g=(c[2]||"w").toLowerCase()[0]; S.emps.push({id:uid(),code:c[0]||"",job:j.id,g:["w","m","d"].includes(g)?g:"w",fix:parseNum(c[3]),v:parseNum(c[4]),h:parseNum(c[5])||S.fte}); ok++; });
    dirty(); render(); toast(`${ok} Zeilen übernommen${miss.size?`, ${miss.size} Stelle(n) nicht gefunden: ${[...miss].join(", ")}`:""}`); }
  else if(a==="clear"){ if(!clearArmed){ clearArmed=true; render(); clearT=setTimeout(()=>{clearArmed=false; render();},4000); }
    else { clearTimeout(clearT); clearArmed=false; S=defaults(); render(); toast("Alle Daten geleert"); } }
  else if(a==="sample"){ S = MODE==="lead"?leadSample():MODE==="sprint"?sprintSample():sample(); render(); toast("Beispieldaten geladen"); }
  else if(a==="resetw"){ S.weights=CRIT.map(c=>c.w); render(); }
});
document.addEventListener("change", ev=>{
  const t = ev.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="jobname"){ jobById(t.dataset.job).name=t.value.trim(); dirty(); render(); }
  else if(a==="jobfam"){ jobById(t.dataset.job).fam=t.value.trim(); dirty(); render(); }
  else if(a==="jobtrack"){ jobById(t.dataset.job).track=t.value; dirty(); render(); }
  else if(a==="lpay"){ jobById(t.dataset.job).pay=parseNum(t.value); render(); }
  else if(a==="sp"){ S.sp[t.dataset.k]=t.value.trim(); render(); }
  else if(a==="spn"){ S.sp[t.dataset.k]=parseNum(t.value); render(); }
  else if(a==="spchk"){ S.sp.checks=S.sp.checks||{}; S.sp.checks[t.dataset.k]=t.checked; render(); }
  else if(a==="sval"){ const j=jobById(t.dataset.job); j[t.dataset.k]=parseNum(t.value); render(); }
  else if(a==="sprog"){ const v=parseNum(t.value); if(v>0) S.prog=v; render(); }
  else if(a==="emp"){ const e=S.emps.find(x=>x.id===t.dataset.id), k=t.dataset.k; e[k] = ["fix","v","h"].includes(k)? parseNum(t.value) : t.value; dirty(); render(); }
  else if(a==="set"){ const v=parseNum(t.value); if(v>0){ S[t.dataset.k]=v; } render(); }
  else if(a==="anchor"){ S.anchor=S.anchor||{}; const v=parseNum(t.value); if(v>0) S.anchor[t.dataset.g]=v; else delete S.anchor[t.dataset.g]; dirty(); render(); }
  else if(a==="setemp"){ S.emp=t.value; render(); }
  else if(a==="weight"){ S.weights=W().slice(); S.weights[+t.dataset.i]=Math.max(1,parseNum(t.value)); dirty(); render(); }
});

S = load();
render();
</script>
